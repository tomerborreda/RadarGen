data:
  dataset_dir: "/path/to/truckscenes"  # Where the TruckScenes dataset lives
  # Map directories (relative to dataset_dir or absolute paths)
  radar_maps_dir: "radar_maps"
  bev_conditioning_maps_dir: "bev_condition_maps"
  image_size: 512
  load_text_feat: false
  load_vae_feat: false
  type: RadarGenDatasetWrapper
  sort_dataset: false
  extra:
    dataset_name: truckscenes
    eval_split: train
    dataset_version: v1.0-trainval
    camera_freq: 10.0
    camera_views: ['CAMERA_RIGHT_FRONT', 'CAMERA_LEFT_FRONT', 'CAMERA_RIGHT_BACK', 'CAMERA_LEFT_BACK']
    coordinate_range: 50.0
    rcs_min: -20.0
    rcs_max: 66.0
    doppler_min: -120.0
    doppler_max: 120.0
# model config
model:
  model: RadarGen_600M_P1_D28
  image_size: 512
  mixed_precision: bf16
  fp32_attention: true
  load_from: hf://Efficient-Large-Model/Sana_600M_512px/checkpoints/Sana_600M_512px_MultiLing.pth
  resume_from:
  aspect_ratio_type: ASPECT_RATIO_512
  attn_type: linear
  ffn_type: glumbconv
  mlp_acts:
    - silu
    - silu
    - null
  mlp_ratio: 2.5
  use_pe: false
  qk_norm: false
  class_dropout_prob: 0.1
  pag_applied_layers: []
  extra:
    num_maps: 3
    num_conditions: 3
vae:
  vae_type: dc-ae
  vae_pretrained: mit-han-lab/dc-ae-f32c32-sana-1.1
  weight_dtype: float32
  scale_factor: 0.41407
  vae_latent_dim: 32
  vae_downsample_rate: 32
  sample_posterior: true
text_encoder:
  text_encoder_name: gemma-2-2b-it
  y_norm: true
  y_norm_scale_factor: 0.01
  model_max_length: 300
  # CHI
  chi_prompt: []
scheduler:
  predict_v: true
  noise_schedule: linear_flow
  pred_sigma: false
  flow_shift: 3.0
  weighting_scheme: logit_normal
  logit_mean: 0.0
  logit_std: 1.0
  vis_sampler: flow_dpm-solver
train:
  num_workers: 10
  seed: 42
  train_batch_size: 16
  num_epochs: 300
  gradient_accumulation_steps: 2
  grad_checkpointing: true
  gradient_clip: 0.1
  optimizer:
    betas:
      - 0.9
      - 0.999
      - 0.9999
    eps:
      - 1.0e-30
      - 1.0e-16
    lr: 0.0001
    type: CAMEWrapper
    weight_decay: 0.0
  lr_schedule: constant
  lr_schedule_args:
    num_warmup_steps: 2000
  log_interval: 20
  save_model_epochs: 10
  work_dir: output/debug
  online_metric: false
  eval_metric_step: 5000
  online_metric_dir: metric_helper